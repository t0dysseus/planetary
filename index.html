<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planetenflug</title>
<style>
:root{--bg:#05060f;--fg:#e8ecff;--muted:#8f98c4;--panel:rgba(14,18,40,.88);--accent:#6ee7ff;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.chip{display:none;font-family:'Share Tech Mono','Fira Code',ui-monospace,monospace;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid #2a3160;background:var(--panel);color:var(--muted)}
.chip.on{display:inline-block;color:#fff;border-color:var(--c);background:rgba(8,15,30,.85);text-shadow:0 0 6px var(--c);box-shadow:0 0 12px var(--c),inset 0 0 8px rgba(255,255,255,.08);animation:chipIn .5s ease-out,chipFlicker 3.2s infinite 1s}
#info{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;max-width:min(420px,90vw);background:var(--panel);border:1px solid #2a3160;border-radius:14px;padding:14px 18px;text-align:center;pointer-events:none}
#info.show{opacity:1;transform:translateX(-50%)}
#info h2{margin:0 0 6px;font-size:18px}
#info p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
#help{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;color:var(--muted)}
#pad{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px;touch-action:none}
#pad button{border-radius:12px;border:1px solid #2a3160;background:var(--panel);color:var(--fg);font-size:18px;touch-action:none}
#pad .u{grid-column:2}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
body{touch-action:none;-webkit-user-select:none;user-select:none}
#pad{display:none;bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
body[data-mode=pad] #pad{display:grid}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);width:130px;height:130px;border-radius:50%;border:1px solid #2a3160;background:var(--panel);touch-action:none;display:none}
body[data-mode=stick] #joy{display:block}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--accent);opacity:.8;pointer-events:none}
#turbo{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);width:76px;height:76px;border-radius:50%;border:1px solid #2a3160;background:var(--panel);color:var(--fg);font-size:30px;touch-action:none;display:none}
body[data-mode=stick] #turbo,body[data-mode=tilt] #turbo{display:block}
#modes{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;gap:4px;padding:4px;border-radius:99px;background:var(--panel);border:1px solid #2a3160}
#modes button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:99px;font-size:13px}
#modes button.on{background:var(--accent);color:#05060f;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);max-width:88vw;background:var(--panel);border:1px solid #2a3160;border-radius:12px;padding:8px 14px;font-size:13px;text-align:center;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
@media (pointer:coarse){#help{display:none}#info{bottom:calc(env(safe-area-inset-bottom,0px) + 210px)}}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(0,0,0,.5) 100%),repeating-linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.05) 3px);mix-blend-mode:multiply}
@keyframes chipIn{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes chipFlicker{0%,88%,100%{opacity:1}90%{opacity:.4}93%{opacity:1}95%{opacity:.6}}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,15,.8);text-align:center;padding:20px}
#win.show{display:flex}
#win div{background:var(--panel);border:1px solid #2a3160;border-radius:16px;padding:24px 28px;max-width:360px}
#win button{margin-top:14px;padding:8px 18px;border-radius:10px;border:0;background:var(--accent);color:#05060f;font-weight:600;cursor:pointer}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hud"></div>
<div id="info"><h2></h2><p></p></div>
<div id="help">Pfeiltasten: fliegen · Leertaste: Turbo · Controller: linker Stick + X/R2 · Fliege nah an einen Planeten heran</div>
<div id="joy"><div id="knob"></div></div>
<button id="turbo" data-k="Space">⚡</button>
<div id="modes"><button data-m="stick">Stick</button><button data-m="pad">Kreuz</button><button data-m="tilt">Neigung</button></div>
<div id="toast"></div>
<div id="pad"><button class="u" data-k="ArrowUp">▲</button><button data-k="Space">⚡</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>
<div id="win"><div><h2>Alle Planeten besucht! 🚀</h2><p>Du hast alle fünf Themen erkundet.</p><button id="again">Nochmal fliegen</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=2600,H=1800;
/* ==========================================================================
   AUDIO - MP3-DATEIEN HIER EINTRAGEN (leer lassen = kein Ton fuer dieses Ereignis)
   Moeglich ist ein Pfad/URL ('sounds/turbo.mp3') oder eine eingebettete Datei
   ('data:audio/mpeg;base64,....'). Hinweis: Auf der von Claude veroeffentlichten
   Seite sind externe URLs gesperrt - dort muessen die MP3s als data:-Adresse
   eingebettet sein. Auf eigenem Webspace funktionieren normale Pfade.
   Taste M = Ton an/aus.
   ========================================================================== */
const AUDIO={
 hintergrund:'sound/main.mp3', // Hintergrundmusik (Schleife, startet nach dem Abflug)
 turbo:'sound/turbo.mp3',       // Turbo (beim Zuenden des Turbos)
 besuch:'sound/planet.mp3',      // Planetenbesuch (fuer alle Planeten gleich)
 start:'sound/start.mp3',       // Startsequenz (beim Start an der Station)
 ende:''         // Endmelodie, sobald alle Planeten besucht wurden
};
const LAUTSTAERKE={hintergrund:.35,turbo:.7,besuch:.8,start:.9,ende:1}; // 0 bis 1
const TURBO_LOOP=false; // true = Turbo-Ton laeuft in Schleife, solange der Turbo gehalten wird
/* ======================== ENDE AUDIO ======================== */
const sfx={};let soundMuted=false,wasTurbo=false,audioUnlocked=false;
for(const k in AUDIO){if(AUDIO[k]){const a=new Audio(AUDIO[k]);a.preload='auto';a.volume=LAUTSTAERKE[k]!==undefined?LAUTSTAERKE[k]:1;sfx[k]=a}}
if(sfx.hintergrund)sfx.hintergrund.loop=true;
if(sfx.turbo&&TURBO_LOOP)sfx.turbo.loop=true;
function snd(k){const a=sfx[k];if(!a)return;try{if(k==='hintergrund'){if(!a.paused)return}else a.currentTime=0;if(k==='ende'&&sfx.hintergrund){sfx.hintergrund.volume=.08;a.onended=()=>{sfx.hintergrund.volume=LAUTSTAERKE.hintergrund!==undefined?LAUTSTAERKE.hintergrund:1}}const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function sndStop(k){const a=sfx[k];if(a){a.pause();a.currentTime=0}}
function unlockAudio(){if(audioUnlocked)return;audioUnlocked=true;for(const k in sfx){const a=sfx[k];a.muted=true;const p=a.play();if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.muted=soundMuted}).catch(()=>{a.muted=soundMuted})}}
['keydown','pointerdown','touchend'].forEach(ev=>addEventListener(ev,unlockAudio));
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M'){soundMuted=!soundMuted;for(const k in sfx)sfx[k].muted=soundMuted;say(soundMuted?'Ton aus (M)':'Ton an (M)')}});
/* PLANETEN: Name (n), Position (x,y), Groesse (r), Farben (c). Die Inhalte der Infofelder stehen weiter unten bei INHALTE. */
const planets=[
 {n:'Inklusion',x:380,y:420,r:70,c:['#ffd27a','#e8832f'],t:'Alle gehören dazu: Barrierefreiheit und Teilhabe als Standard statt als Sonderfall.'},
 {n:'Digitalisierung',x:900,y:250,r:85,c:['#8fe9ff','#2a7fd6'],ring:1,t:'Technologie eröffnet Chancen – aber nur, wenn niemand digital abgehängt wird.'},
 {n:'Lohndumping',x:1950,y:330,r:65,c:['#ff9a9a','#b3263e'],t:'Unfaire Löhne drücken Standards. Faire Bezahlung ist Basis für Vertrauen und Qualität.'},
 {n:'Authentizität',x:500,y:1300,r:75,c:['#c8a8ff','#6a3fc2'],t:'Glaubwürdig handeln statt nur kommunizieren: Haltung muss im Alltag gelebt werden.'},
 {n:'Gesellschaftliche Verantwortung',x:1900,y:1450,r:90,c:['#a6f5b4','#1f8f55'],t:'Unternehmen wirken über den Profit hinaus – auf Umwelt, Region und Gesellschaft.'},
 {n:'Politisierung',x:2300,y:900,r:80,c:['#ff8fd0','#a3226b'],t:'Haltung zeigen: Wer sich politisch einbringt, gestaltet Gesellschaft und Arbeitswelt mit.'},
 {n:'Generative KI',x:1300,y:1580,r:80,c:['#fff3a0','#d9a521'],t:'Neue Werkzeuge verändern Arbeit – entscheidend sind Kompetenz, Kritikfähigkeit und klare Regeln.'}
];
let visited,ship,keys={},stars=[],cam={x:0,y:0},near=null,turboOn=false,phase=0,pt=0,flameK=0,armed=false,stick={x:0,y:0},gp={x:0,y:0,turbo:false,brake:0},gpOn=false,mode='key';const touch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;const dock={x:W/2,y:H/2-75};
for(let i=0;i<300;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.3,p:Math.random()*.5+.2});
/* ==========================================================================
   INHALTE DER PLANETEN - HIER AUSTAUSCHEN
   planet : muss exakt dem Namen (n:'...') in der Planeten-Liste oben entsprechen
   titel  : Ueberschrift des Infofelds auf dem Planeten
   punkte : Stichpunkte (beliebig viele, lange Zeilen brechen automatisch um).
            Mit **Wort** leuchtet ein Begriff neon auf und glimmert.
   ========================================================================== */
const INHALTE=[
 {planet:'Inklusion',titel:'Inklusion',punkte:['Alle geh\u00f6ren dazu \u2013 **Teilhabe** als Standard','**Barrierefreiheit** in Inhalten, Tools und Sprache','**Jeder** soll Inhalte verstehen']},
 {planet:'Digitalisierung',titel:'Digitalisierung',punkte:['Technologie er\u00f6ffnet neue **Chancen**','Digitale **Kompetenz** wird zur Grundvoraussetzung','Niemand darf digital **abgeh\u00e4ngt** werden']},
 {planet:'Lohndumping',titel:'Lohndumping',punkte:['Unfaire L\u00f6hne dr\u00fccken **Standards**','**Faire Bezahlung** schafft Vertrauen und Qualit\u00e4t','**Transparenz** bei Geh\u00e4ltern und Vertr\u00e4gen']},
 {planet:'Authentizit\u00e4t',titel:'Authentizit\u00e4t',punkte:['**Glaubw\u00fcrdig** handeln statt nur kommunizieren','**Haltung** muss im Alltag gelebt werden','Werte und Verhalten m\u00fcssen **zusammenpassen**']},
 {planet:'Gesellschaftliche Verantwortung',titel:'Gesellschaftliche Verantwortung',punkte:['**Wirkung** \u00fcber den Profit hinaus','**Umwelt, Region und Gesellschaft** im Blick','**Nachhaltig** wirtschaften']},
 {planet:'Politisierung',titel:'Politisierung',punkte:['**Haltung** zeigen und sich einbringen','Arbeitswelt aktiv **mitgestalten**','Politische Debatten verlangen **Urteilsf\u00e4higkeit**']},
 {planet:'Generative KI',titel:'Generative KI',punkte:['Neue Werkzeuge ver\u00e4ndern **Arbeit**','**Kompetenz** und **Kritikf\u00e4higkeit** sind entscheidend','Klare **Regeln** f\u00fcr den Einsatz']}
];
const SCHRIFTGROESSE=1; // 1 = normal, z. B. 1.3 = groesser fuer Beamer
/* ======================== ENDE INHALTE ======================== */
planets.forEach(p=>{const c=INHALTE.find(x=>x.planet===p.n)||{};p.title=c.titel||p.n;p.lines=c.punkte||[p.t]});
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
planets.forEach(p=>{p.f=[];for(let k=0;k<50;k++){const a=rnd()*6.283,d=Math.sqrt(rnd())*p.r*.95;p.f.push({x:Math.cos(a)*d,y:Math.sin(a)*d,r:p.r*(.05+rnd()*.12),l:rnd()<.35,o:rnd()*6.283})}});
const hud=document.getElementById('hud');
planets.forEach((p,i)=>{const e=document.createElement('span');e.className='chip';e.id='chip'+i;e.textContent=p.n;hud.appendChild(e)});
function reset(){visited=new Set();ship={x:dock.x,y:dock.y,vx:0,vy:0,a:-Math.PI/2};armed=false;phase=0;pt=0;flameK=0;const z0=Math.min(1,Math.max(.75,innerWidth/820));cam.x=dock.x-innerWidth/(2*z0);cam.y=dock.y+130/z0-innerHeight/(2*z0);planets.forEach((p,i)=>{const e=document.getElementById('chip'+i);e.classList.remove('on');e.style.background=''});document.getElementById('win').classList.remove('show')}
function resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();reset();
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.code==='Space'){keys[e.code==='Space'?'Space':e.key]=1;e.preventDefault()}});
addEventListener('keyup',e=>{delete keys[e.code==='Space'?'Space':e.key]});
document.querySelectorAll('#pad button,#turbo').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{keys[k]=1;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>delete keys[k]))});
document.getElementById('again').onclick=reset;
const info=document.getElementById('info');
function step(){
 pollPad();if(phase===0&&!armed){pt=0;if(keys.Space||gp.turbo){armed=true;snd('start')}}else pt++;if(phase===0&&pt>=440){phase=1;pt=0}else if(phase===1&&pt>=50){phase=2;pt=0;snd('hintergrund')}
 const ks=phase===2?keys:{};turboOn=!!(ks.Space||(phase===2&&gp.turbo))||phase===1;if(turboOn&&!wasTurbo)snd('turbo');if(!turboOn&&wasTurbo&&TURBO_LOOP)sndStop('turbo');wasTurbo=turboOn;const acc=turboOn?.35:.22;let ax=0,ay=0,thrust=false;
 if(phase===0){ship.vx=0;ship.vy=0;ship.x=dock.x;ship.y=dock.y;ship.a=-Math.PI/2;thrust=armed;flameK=Math.min(1,pt/400)}
 else if(phase===1){ship.a=-Math.PI/2;thrust=true;flameK=1}
 else flameK=1;
 if(ks.ArrowLeft)ax-=1;if(ks.ArrowRight)ax+=1;if(ks.ArrowUp)ay-=1;if(ks.ArrowDown)ay+=1;if(phase===2){ax+=stick.x+gp.x;ay+=stick.y+gp.y}
 if(ax||ay){const l=Math.hypot(ax,ay);const m=Math.min(1,l);ship.vx+=ax/l*acc*m;ship.vy+=ay/l*acc*m;thrust=true}else if(turboOn){ship.vx+=Math.cos(ship.a)*acc;ship.vy+=Math.sin(ship.a)*acc;thrust=true}
 ship.vx*=.985;ship.vy*=.985;if(phase===2&&gp.brake>.05){const bf=1-.14*gp.brake;ship.vx*=bf;ship.vy*=bf}
 ship.x+=ship.vx;ship.y+=ship.vy;
 if(ship.x<-RAND||ship.x>W+RAND){ship.vx*=-.5;ship.x=Math.max(-RAND,Math.min(W+RAND,ship.x))}
 if(ship.y<-RAND||ship.y>H+RAND){ship.vy*=-.5;ship.y=Math.max(-RAND,Math.min(H+RAND,ship.y))}
 if(Math.hypot(ship.vx,ship.vy)>.4){const t=Math.atan2(ship.vy,ship.vx);let d=t-ship.a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;ship.a+=d*.12}
 near=null;let nb=null,nd=1e9;planets.forEach(q=>{const dd=Math.hypot(ship.x-q.x,ship.y-q.y)-q.r;if(dd<nd){nd=dd;nb=q}});
 planets.forEach((p,i)=>{
  const dx=ship.x-p.x,dy=ship.y-p.y,d=Math.hypot(dx,dy);const on=d<p.r+170&&p===nb&&!planets.some(q=>q!==p&&(q.al||0)>.15);p.al=(p.al||0)+((on?1:0)-(p.al||0))*(on?.12:.22);if(phase===2&&d<p.r+180){const k=Math.max(0,(d-p.r)/180);const f=.88+.1*k;ship.vx*=f;ship.vy*=f}
  if(d<p.r+14){const nx=dx/d,ny=dy/d,dot=ship.vx*nx+ship.vy*ny;if(dot<0){ship.vx-=1.0*dot*nx;ship.vy-=1.0*dot*ny}ship.x=p.x+nx*(p.r+14);ship.y=p.y+ny*(p.r+14)}
  const inz=d<p.r+90;if(inz&&!p.in&&phase===2)triggerFlyby(p.n,p);p.in=inz;if(inz){near=p;if(!visited.has(i)){visited.add(i);const e=document.getElementById('chip'+i);e.classList.add('on');e.style.setProperty('--c',p.c[0]);if(visited.size===planets.length)snd('ende');}}
 });
 
 return thrust;
}
/* ===== STATION: Begriffe der Ladeanzeige hier austauschen ===== */
const WORDS=['Studium','Hard Skills','Soft Skills','Praktika','Arbeitserfahrung'];
function drawStation(){
 const x=W/2,y=H/2+35;ctx.save();ctx.translate(x,y);
 [-108,64].forEach(x0=>{ctx.fillStyle='#2b5fa8';ctx.strokeStyle='#8fb4ff';ctx.lineWidth=1;ctx.fillRect(x0,-12,44,24);ctx.strokeRect(x0,-12,44,24);for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(x0+i*11,-12);ctx.lineTo(x0+i*11,12);ctx.stroke()}});
 ctx.strokeStyle='#8f98c4';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,62,15,0,0,7);ctx.stroke();
 const g=ctx.createRadialGradient(-8,-8,4,0,0,28);g.addColorStop(0,'#e8ecff');g.addColorStop(1,'#4a5390');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,28,0,7);ctx.fill();
 ctx.fillStyle='#2a3160';ctx.fillRect(-34,-36,68,8);ctx.strokeStyle='#8f98c4';ctx.lineWidth=1.5;ctx.strokeRect(-34,-36,68,8);
 ctx.fillStyle=Math.floor(performance.now()/400)%2?'#6ee7ff':'#ffd27a';[-12,0,12].forEach(dx=>{ctx.beginPath();ctx.arc(dx,6,2.5,0,7);ctx.fill()});
 ctx.fillStyle='#e8ecff';ctx.font='15px '+MONO;ctx.textAlign='center';ctx.fillText('Vorbereitung',0,58);
 const al=phase<2?1:Math.max(0,1-pt/120);
 if(al>0){ctx.globalAlpha=al;const px=-125,py=75;neonBox(px,py,250,172,'#00f0ff',0);
  ctx.textAlign='left';ctx.fillStyle='#8f98c4';ctx.font='12px '+MONO;ctx.fillText(phase===0&&!armed?(gpOn?'X-Taste oder Leertaste zum Start':touch?'⚡ tippen zum Start':'Leertaste drücken zum Start'):phase===0&&pt<400?'Vorbereitung lädt …':'Bereit – Start!',px+14,py+22);
  WORDS.forEach((w,i)=>{const p=phase===0?Math.max(0,Math.min(1,(pt-i*80)/80)):1,yy=py+52+i*25;ctx.fillStyle=p>=1?'#e8ecff':'#8f98c4';ctx.font='13px '+MONO;ctx.fillText(w,px+14,yy);ctx.fillStyle='#1c2250';ctx.fillRect(px+130,yy-9,80,8);ctx.fillStyle=p>=1?'#6ee7a0':'#6ee7ff';ctx.fillRect(px+130,yy-9,80*p,8);if(p>=1){ctx.fillStyle='#6ee7a0';ctx.fillText('✓',px+222,yy)}});
  ctx.globalAlpha=1}
 ctx.restore()}
function draw(thrust){
 const vw=innerWidth,vh=innerHeight;
 const z=Math.min(1,Math.max(.75,vw/820)),oy=phase===0?130:0;cam.x+=(ship.x-vw/(2*z)-cam.x)*.1;cam.y+=(ship.y+oy/z-vh/(2*z)-cam.y)*.1;
 ctx.fillStyle='#05060f';ctx.fillRect(0,0,vw,vh);
 stars.forEach(s=>{const x=((s.x-cam.x*s.p)%vw+vw)%vw,y=((s.y-cam.y*s.p)%vh+vh)%vh;ctx.fillStyle='rgba(255,255,255,'+(.3+s.p)+')';ctx.fillRect(x,y,s.s,s.s)});
 drawSky(vw,vh);ctx.save();ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
 drawMilkyWay();
 planets.forEach((p,i)=>{
  if(p.ring){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.35);ctx.strokeStyle='rgba(200,230,255,.5)';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,p.r*1.7,p.r*.45,0,Math.PI,2*Math.PI);ctx.stroke();ctx.restore()}

function pollPad(){gp.x=0;gp.y=0;gp.turbo=false;gp.brake=0;const ps=navigator.getGamepads?navigator.getGamepads():[];for(const p of ps){if(!p||!p.connected)continue;gpOn=true;let x=p.axes[0]||0,y=p.axes[1]||0;const m=Math.hypot(x,y);if(m<.15){x=0;y=0}else{const s=Math.min(1,(m-.15)/.8)/m;x*=s;y*=s}const b=i=>p.buttons[i]&&p.buttons[i].pressed;if(b(14))x=-1;if(b(15))x=1;if(b(12))y=-1;if(b(13))y=1;gp.x=x;gp.y=y;gp.turbo=!!(b(0)||b(7));gp.brake=p.buttons[6]?(p.buttons[6].value||(p.buttons[6].pressed?1:0)):0;break}}
